name: Deploy ERPNext to GCP Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/deploy-erpnext.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker for GCP
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/Dockerfile.erpnext
        push: true
        tags: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/erpnext-repo/erpnext:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy erpnext-web \
          --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/erpnext-repo/erpnext:latest \
          --region=us-central1 \
          --allow-unauthenticated \
          --min-instances=0 \
          --max-instances=1 \
          --cpu-throttling \
          --memory=2Gi \
          --cpu=1 \
          --project=${{ secrets.GCP_PROJECT_ID }}
